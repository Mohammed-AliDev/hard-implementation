[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "hard-implementation"
version = "1.2.1"
description = "The complete universal implementation workflow with guided setup for coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Mohammed-AliDev"}]
dependencies = ["rich>=13.9,<15", "questionary>=2.1,<3"]

[project.scripts]
hard = "hard_implementation.cli:main"

[project.urls]
Homepage = "https://github.com/Mohammed-AliDev/hard-implementation"
Issues = "https://github.com/Mohammed-AliDev/hard-implementation/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hard_implementation"]

[tool.hatch.build.targets.wheel.force-include]
"install.py" = "hard_implementation/installer.py"
"distribution.json" = "hard_implementation/resources/distribution.json"
"skills/hard-implementation" = "hard_implementation/resources/skills/hard-implementation"
"adapters" = "hard_implementation/resources/adapters"

[tool.hatch.build.targets.sdist]
include = ["src", "install.py", "distribution.json", "skills", "adapters", "scripts", "tests", "docs", "README.md", "README.ar.md", "LICENSE", "CHANGELOG.md", "pyproject.toml", ".gitattributes"]

