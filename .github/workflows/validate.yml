name: Validate package
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/check_consistency.py
      - run: python scripts/check_consistency.py --github
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: hard --version
      - run: hard init .test-artifacts/installed-cli --agent all --yes
      - run: hard status .test-artifacts/installed-cli
      - run: hard detect .test-artifacts/installed-cli --json
      - run: python scripts/build_distribution.py
      - run: git diff --exit-code
